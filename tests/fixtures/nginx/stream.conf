# Existing routes must stay byte-for-byte intact.
map $ssl_preread_server_name $backend {
    panel.example.com panel;
    default xray;
}
upstream panel { server 127.0.0.1:8443; }
upstream xray { server 127.0.0.1:9443; }
server {
    listen 443;
    ssl_preread on;
    proxy_protocol on;
    proxy_pass $backend;
}
