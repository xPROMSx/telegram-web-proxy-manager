# setup_acme_http(), 3X-UI 994414f54322712ba30fc03af21bee0a2c2c4f5f
# 253-byte DNS key plus 64-bit hash entry/sentinel; nginx aligns to cache lines.
server_names_hash_bucket_size 272;
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com reality.example.com;
    server_tokens off;
    if ($host !~* ^(panel\.example\.com|reality\.example\.com)$) { return 404; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
