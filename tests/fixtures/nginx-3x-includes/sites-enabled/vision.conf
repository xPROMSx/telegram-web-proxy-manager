server {
    listen 127.0.0.1:10444 proxy_protocol;
    server_name vision.example.com;
    server_tokens off;
    root /var/www/html;
    index index.html;
    real_ip_header proxy_protocol;
    set_real_ip_from 127.0.0.1;
    if ($host != vision.example.com) { return 404; }
    location / { try_files $uri $uri/ =404; }
}
