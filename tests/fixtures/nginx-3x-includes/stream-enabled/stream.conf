# 253-byte DNS key plus 64-bit hash entry/sentinel; nginx aligns to cache lines.
map_hash_bucket_size 272;
map $ssl_preread_server_name $sni_name {
    hostnames;
    vision.example.com vision;
    reality.example.com    xray;
    panel.example.com            www;
    include stream-sni.d/*.conf;
    default              xray;
}

upstream xray {
    server 127.0.0.1:8443 max_fails=0;
    server 127.0.0.1:9443 backup;
}
upstream www  { server 127.0.0.1:7443; }

include stream-upstreams.d/*.conf;

server {
    proxy_protocol on;
    set_real_ip_from unix:;
    listen     443;
    listen [::]:443;
    proxy_pass $sni_name;
    ssl_preread on;
}

upstream vision { server 127.0.0.1:10443; }
