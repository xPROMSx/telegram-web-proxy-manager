name: checks
'on':
  pull_request: null
  push:
    branches:
    - main
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  scope:
    name: Plan / Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      full: ${{ steps.plan.outputs.full }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - name: Exact checkout and production identities
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git rev-parse HEAD

        git hash-object telemt-web-manager.sh lib/safety.py install.sh

        '
    - name: Conservative exact revision plan
      id: plan
      env:
        CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        CI_EVENT: ${{ github.event_name }}
      run: python3 tests/ci_plan.py classify --base "$CI_BASE" --head "$CI_HEAD" --event "$CI_EVENT"
  static:
    name: CI / Static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Exact checkout and production identities
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git rev-parse HEAD

        git hash-object telemt-web-manager.sh lib/safety.py install.sh

        '
    - name: Install static tools
      run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml
    - name: for file in install.sh telemt-web-manager.sh tests/*.sh; do bash -n "$file"; done
      run: for file in install.sh telemt-web-manager.sh tests/*.sh; do bash -n "$file"; done
    - name: shellcheck -x install.sh telemt-web-manager.sh tests/*.sh
      run: shellcheck -x install.sh telemt-web-manager.sh tests/*.sh
    - name: "python3 - <<'PY'\nfrom pathlib import Path\nfor path in [*Path('tests').glob('*.py'), *Path('lib').glob('*.py')]:\n    compile(path.read_bytes(),\
        \ str(path), 'exec')\nprint('Python syntax: PASS')\nPY"
      run: "python3 - <<'PY'\nfrom pathlib import Path\nfor path in [*Path('tests').glob('*.py'), *Path('lib').glob('*.py')]:\n    compile(path.read_bytes(),\
        \ str(path), 'exec')\nprint('Python syntax: PASS')\nPY"
    - name: Pinned actionlint 1.7.7 + SHA256
      run: 'directory=$(mktemp -d)

        trap ''rm -rf -- "$directory"'' EXIT

        curl --proto "=https" --tlsv1.2 -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
        -o "$directory/actionlint.tar.gz"

        printf "%s  %s\n" 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 "$directory/actionlint.tar.gz" | sha256sum -c -

        tar -xzf "$directory/actionlint.tar.gz" -C "$directory" actionlint

        "$directory/actionlint"

        '
    - name: python3 tests/ci_manifest.py
      run: python3 tests/ci_manifest.py
    - name: bash tests/pinned.sh --docs
      run: bash tests/pinned.sh --docs
    - name: python3 tests/ci_docs.py
      run: python3 tests/ci_docs.py
    - name: python3 -m unittest discover -s tests -p 'test_ci*.py' -v
      run: python3 -m unittest discover -s tests -p 'test_ci*.py' -v
    needs:
    - scope
    if: always()
  regression:
    name: CI / Regression
    needs:
    - scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Exact checkout and production identities
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git rev-parse HEAD

        git hash-object telemt-web-manager.sh lib/safety.py install.sh

        '
    - name: Install test tools
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream iptables nftables conntrack certbot passwd iproute2
        util-linux curl python3 python3-yaml openssl ca-certificates
    - name: sudo env PYTHONDONTWRITEBYTECODE=1 bash tests/run.sh
      run: sudo env PYTHONDONTWRITEBYTECODE=1 bash tests/run.sh
    - name: bash tests/bootstrap_versions.sh
      run: bash tests/bootstrap_versions.sh
    - name: bash tests/preflight.sh
      run: bash tests/preflight.sh
    - name: bash tests/versions.sh
      run: bash tests/versions.sh
    - name: bash tests/contracts.sh
      run: bash tests/contracts.sh
    - name: bash tests/locks.sh
      run: bash tests/locks.sh
    - name: sudo env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_transactions.py
      run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_transactions.py
    - name: sudo env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_bootstrap.py
      run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_bootstrap.py
  telemt:
    name: Integration / Telemt
    needs:
    - scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Exact checkout and production identities
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git rev-parse HEAD

        git hash-object telemt-web-manager.sh lib/safety.py install.sh

        '
    - name: Install test tools
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream iptables nftables conntrack certbot passwd iproute2
        util-linux curl python3 python3-yaml openssl ca-certificates
    - name: Private official artifact directory
      run: 'provenance="/var/tmp/twm-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        sudo install -d -o root -g root -m 0700 "$provenance"

        printf "TELEMT_UPDATE_ARTIFACTS=%s\n" "$provenance" >> "$GITHUB_ENV"

        '
    - name: Verify official provenance and download both architectures + baseline
      env:
        TELEMT_TEST_GITHUB_TOKEN: ${{ github.token }}
      run: sudo --preserve-env=TELEMT_TEST_GITHUB_TOKEN env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_provenance.py "$TELEMT_UPDATE_ARTIFACTS"
    - name: Conntrack runtime PATH and baseline evidence
      run: 'command -v conntrack

        systemd-path search-binaries-default

        env -i PATH="$(systemd-path search-binaries-default)" conntrack --version

        evidence="$RUNNER_TEMP/telemt-pinned-evidence"

        mkdir -m 0700 "$evidence"

        printf "TELEMT_TEST_EVIDENCE_DIR=%s\n" "$evidence" >> "$GITHUB_ENV"

        '
    - name: bash tests/download.sh
      run: bash tests/download.sh
    - name: bash tests/pinned.sh
      run: bash tests/pinned.sh
    - name: bash tests/upstream.sh
      run: bash tests/upstream.sh
    - name: bash tests/staging.sh
      run: bash tests/staging.sh
    - name: sudo env TELEMT_TEST_EVIDENCE_DIR="$TELEMT_TEST_EVIDENCE_DIR" bash tests/runtime.sh
      run: sudo env TELEMT_TEST_EVIDENCE_DIR="$TELEMT_TEST_EVIDENCE_DIR" bash tests/runtime.sh
    - name: bash tests/pinned.sh --versions
      run: bash tests/pinned.sh --versions
    - name: bash tests/conntrack.sh
      run: bash tests/conntrack.sh
  lifecycle:
    name: Integration / Lifecycle
    needs:
    - scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Exact checkout and production identities
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git rev-parse HEAD

        git hash-object telemt-web-manager.sh lib/safety.py install.sh

        '
    - name: Install test tools
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream iptables nftables conntrack certbot passwd iproute2
        util-linux curl python3 python3-yaml openssl ca-certificates
    - name: Private official artifact directory
      run: 'provenance="/var/tmp/twm-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        sudo install -d -o root -g root -m 0700 "$provenance"

        printf "TELEMT_UPDATE_ARTIFACTS=%s\n" "$provenance" >> "$GITHUB_ENV"

        '
    - name: Verify official provenance and download both architectures + baseline
      env:
        TELEMT_TEST_GITHUB_TOKEN: ${{ github.token }}
      run: sudo --preserve-env=TELEMT_TEST_GITHUB_TOKEN env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_provenance.py "$TELEMT_UPDATE_ARTIFACTS"
    - name: bash tests/fresh.sh
      run: bash tests/fresh.sh
    - name: bash tests/fresh-rollback.sh
      run: bash tests/fresh-rollback.sh
    - name: sudo bash tests/fresh-account.sh
      run: sudo bash tests/fresh-account.sh
    - name: sudo bash tests/bootstrap.sh
      run: sudo bash tests/bootstrap.sh
    - name: sudo python3 tests/web_link_fixture.py
      run: sudo python3 tests/web_link_fixture.py
    - name: sudo env TELEMT_UPDATE_ARTIFACTS="$TELEMT_UPDATE_ARTIFACTS" PYTHONDONTWRITEBYTECODE=1 bash tests/uninstall.sh
      run: sudo env TELEMT_UPDATE_ARTIFACTS="$TELEMT_UPDATE_ARTIFACTS" PYTHONDONTWRITEBYTECODE=1 bash tests/uninstall.sh
  nginx:
    name: Integration / Nginx
    needs:
    - scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Exact checkout and production identities
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git rev-parse HEAD

        git hash-object telemt-web-manager.sh lib/safety.py install.sh

        '
    - name: Install test tools
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream iptables nftables conntrack certbot passwd iproute2
        util-linux curl python3 python3-yaml openssl ca-certificates
    - name: bash tests/acme.sh
      run: bash tests/acme.sh
    - name: sudo bash tests/renewal.sh
      run: sudo bash tests/renewal.sh
    - name: bash tests/nginx.sh
      run: bash tests/nginx.sh
    - name: bash tests/three-x-ui.sh
      run: bash tests/three-x-ui.sh
  system26:
    name: System / Ubuntu 26.04
    needs:
    - scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Exact checkout and production identities
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git rev-parse HEAD

        git hash-object telemt-web-manager.sh lib/safety.py install.sh

        '
    - name: Install test tools
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream iptables nftables conntrack certbot passwd iproute2
        util-linux curl python3 python3-yaml openssl ca-certificates
    - name: Private official artifact directory
      run: 'provenance="/var/tmp/twm-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        sudo install -d -o root -g root -m 0700 "$provenance"

        printf "TELEMT_UPDATE_ARTIFACTS=%s\n" "$provenance" >> "$GITHUB_ENV"

        '
    - name: Verify official provenance and download both architectures + baseline
      env:
        TELEMT_TEST_GITHUB_TOKEN: ${{ github.token }}
      run: sudo --preserve-env=TELEMT_TEST_GITHUB_TOKEN env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_provenance.py "$TELEMT_UPDATE_ARTIFACTS"
    - name: Private boot evidence directory
      run: printf "TELEMT_UPDATE_BOOT_DIR=%s\n" "$RUNNER_TEMP/telemt-universal-boot" >> "$GITHUB_ENV"
    - name: bash tests/update_boot.sh 26.04
      run: bash tests/update_boot.sh 26.04
  system24:
    name: System / Ubuntu 24.04
    needs:
    - scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Exact checkout and production identities
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git rev-parse HEAD

        git hash-object telemt-web-manager.sh lib/safety.py install.sh

        '
    - name: Install test tools
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream iptables nftables conntrack certbot passwd iproute2
        util-linux curl python3 python3-yaml openssl ca-certificates
    - name: Private official artifact directory
      run: 'provenance="/var/tmp/twm-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        sudo install -d -o root -g root -m 0700 "$provenance"

        printf "TELEMT_UPDATE_ARTIFACTS=%s\n" "$provenance" >> "$GITHUB_ENV"

        '
    - name: Verify official provenance and download both architectures + baseline
      env:
        TELEMT_TEST_GITHUB_TOKEN: ${{ github.token }}
      run: sudo --preserve-env=TELEMT_TEST_GITHUB_TOKEN env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_provenance.py "$TELEMT_UPDATE_ARTIFACTS"
    - name: Private boot evidence directory
      run: printf "TELEMT_UPDATE_BOOT_DIR=%s\n" "$RUNNER_TEMP/telemt-universal-boot" >> "$GITHUB_ENV"
    - name: bash tests/update_boot.sh 24.04
      run: bash tests/update_boot.sh 24.04
  arm:
    name: Architecture / ARM64
    needs:
    - scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Exact checkout and production identities
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: 'test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        git rev-parse HEAD

        git hash-object telemt-web-manager.sh lib/safety.py install.sh

        '
    - name: Install test tools
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream iptables nftables conntrack certbot passwd iproute2
        util-linux curl python3 python3-yaml openssl ca-certificates
    - name: Private official artifact directory
      run: 'provenance="/var/tmp/twm-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        sudo install -d -o root -g root -m 0700 "$provenance"

        printf "TELEMT_UPDATE_ARTIFACTS=%s\n" "$provenance" >> "$GITHUB_ENV"

