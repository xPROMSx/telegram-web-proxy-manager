name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream iptables nftables conntrack certbot passwd iproute2 util-linux curl python3 openssl ca-certificates
      - name: Telemt conntrack dependency and default systemd runtime PATH
        run: |
          command -v conntrack
          systemd-path search-binaries-default
          env -i PATH="$(systemd-path search-binaries-default)" conntrack --version
          evidence="$RUNNER_TEMP/telemt-pinned-evidence"
          mkdir -m 0700 "$evidence"
          printf 'TELEMT_TEST_EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
          provenance="/var/tmp/twm-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -o root -g root -m 0700 "$provenance"
          printf 'TELEMT_UPDATE_ARTIFACTS=%s\n' "$provenance" >> "$GITHUB_ENV"
          printf 'TELEMT_UPDATE_BOOT_DIR=%s\n' "$RUNNER_TEMP/telemt-universal-boot" >> "$GITHUB_ENV"
      - name: Exact checkout and production blob identities
        run: |
          git rev-parse HEAD
          git hash-object telemt-web-manager.sh lib/safety.py install.sh
      - name: Bash syntax
        run: for file in install.sh telemt-web-manager.sh tests/*.sh; do bash -n "$file"; done
      - name: ShellCheck
        run: shellcheck -x install.sh telemt-web-manager.sh tests/*.sh
      - name: Universal Update official 3.5.13 provenance and downloads (both GNU architectures; no candidate execution)
        env:
          TELEMT_TEST_GITHUB_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=TELEMT_TEST_GITHUB_TOKEN env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_provenance.py "$TELEMT_UPDATE_ARTIFACTS"
      - name: Parser/unit and fresh transaction fixtures (service/path/journal transport mocked)
        # Archive/receipt tests exercise the production root-owned metadata contract.
        run: sudo env PYTHONDONTWRITEBYTECODE=1 bash tests/run.sh && bash tests/fresh.sh && bash tests/fresh-rollback.sh && bash tests/download.sh && bash tests/bootstrap_versions.sh && bash tests/preflight.sh
      - name: Private WEB link identity, read-only menu and committed Install display (real root/PTY; lifecycle mocked)
        run: sudo python3 tests/web_link_fixture.py
      - name: Real fresh account and owned runtime-state rollback (temporary root-owned fixtures)
        run: sudo bash tests/fresh-account.sh
      - name: Pinned Telemt 3.5.12 release provenance and real config healthcheck (no runtime)
        run: bash tests/pinned.sh && bash tests/upstream.sh
      - name: Pinned Telemt 3.5.12 staging healthcheck (service/path health mocked)
        run: bash tests/staging.sh
      - name: Real Telemt 3.5.12 runtime smoke in isolated network namespace (no systemd)
        run: sudo env TELEMT_TEST_EVIDENCE_DIR="$TELEMT_TEST_EVIDENCE_DIR" bash tests/runtime.sh
      - name: Production pin equals real downloaded, staging, runtime and documented version
        run: bash tests/pinned.sh --versions
      - name: Manager bootstrap release selection, atomic pair update and rollback (temporary root-owned fixtures)
        run: sudo bash tests/bootstrap.sh
      - name: Managed uninstall, certificate reuse/delete and transaction rollback (private local fixtures)
        run: sudo env TELEMT_UPDATE_ARTIFACTS="$TELEMT_UPDATE_ARTIFACTS" PYTHONDONTWRITEBYTECODE=1 bash tests/uninstall.sh
      - name: Version precedence, strict parser and offline future receipt (synthetic binary/lifecycle)
        run: bash tests/versions.sh
      - name: Universal generation transaction, full DATA and every intent/result crash boundary (real root filesystem; service/API mocked)
        run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_transactions.py
      - name: Bootstrap recovery schema and corrupt/pending generation barrier (real root pair commit; no candidate execution)
        run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_bootstrap.py
      - name: Real nf_tables diagnostic in namespace (synthetic log bridge; no Telemt runtime)
        run: bash tests/conntrack.sh
      - name: Writable state and systemd contract
        run: bash tests/contracts.sh
      - name: Shared check lock and exclusive mutation races
        run: bash tests/locks.sh
      - name: Certbot and Nginx webroot transactions
        run: bash tests/acme.sh
      - name: Renewal socket, deploy hook and scheduler contracts (temporary root-owned fixtures)
        run: sudo bash tests/renewal.sh
      - name: Real Nginx stream and TLS fixture
        run: bash tests/nginx.sh
      - name: Current reviewed 3x-ui-pro installer and patcher topologies
        run: bash tests/three-x-ui.sh
      - name: Real Ubuntu 24.04 systemd boot, official Update, hostile isolation, filesystem and abrupt power-loss recovery (offline QEMU)
        run: bash tests/update_boot.sh 24.04
      - name: Official ARM64 executable version and direct/SOCKS strict healthcheck (qemu-user; no native ARM runtime claim)
        run: bash tests/update_arm.sh 24.04
      - name: Real Ubuntu 26.04 systemd boot, official Update, hostile isolation, filesystem and abrupt power-loss recovery (offline QEMU)
        run: bash tests/update_boot.sh 26.04
