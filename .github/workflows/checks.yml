        TELEMT_TEST_GITHUB_TOKEN: ${{ github.token }}
      run: sudo --preserve-env=TELEMT_TEST_GITHUB_TOKEN env PYTHONDONTWRITEBYTECODE=1 python3 tests/update_provenance.py "$TELEMT_UPDATE_ARTIFACTS"
    - name: Build minimal existing ARM parser environment (no kernel/QEMU system image)
      run: docker build --secret "id=system_ca,src=${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}" -f tests/ci_arm.Dockerfile -t twm-boot:24.04
        .
    - name: bash tests/update_arm.sh 24.04
      run: bash tests/update_arm.sh 24.04
  required:
    name: CI / Required
    needs:
    - scope
    - static
    - regression
    - telemt
    - lifecycle
    - nginx
    - system26
    - system24
    - arm
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Enforce exact selected job results
      env:
        CI_MODE: ${{ needs.scope.outputs.mode }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: python3 tests/ci_plan.py gate
