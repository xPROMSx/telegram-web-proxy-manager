name: checks
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream
      - name: Bash syntax
        run: for file in telemt-web-manager.sh tests/*.sh; do bash -n "$file"; done
      - name: ShellCheck
        run: shellcheck -x telemt-web-manager.sh tests/*.sh
      - name: Unit and fixture tests (no root, no production access)
        run: bash tests/run.sh && bash tests/fresh.sh
      - name: Published Telemt configuration contract (SHA256 verified)
        run: bash tests/upstream.sh
      - name: Real Nginx stream and TLS fixture
        run: bash tests/nginx.sh
